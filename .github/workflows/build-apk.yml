name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Create Dummy Environment & Secret Files (Fix build errors if secrets absent)
        run: |
          # Prevent missing .env errors for Secrets Gradle Plugin
          touch .env
          if [ ! -f .env.example ]; then
            touch .env.example
          fi
          
          # Ensure a fallback debug keystore exists if not checked in
          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (Unsigned / Fallback)
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || echo "Release build requires keystore secret, debug APK built successfully."

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: statusbar-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Release APK Artifact (if available)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statusbar-studio-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: ignore
