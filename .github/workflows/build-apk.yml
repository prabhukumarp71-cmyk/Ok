name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Create Environment & Keystore Files
        run: |
          # Prevent missing .env errors for Secrets Gradle Plugin
          touch .env
          if [ ! -f .env.example ]; then
            touch .env.example
          fi

          # Decode or generate debug.keystore so APK signing succeeds
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore || true
            fi
          fi

          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Generate Gradle wrapper files if not in git repository
          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper via installed Gradle..."
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug -Djava.awt.headless=true -Pksp.run.in.process=false --no-daemon --stacktrace
          else
            gradle assembleDebug -Djava.awt.headless=true -Pksp.run.in.process=false --no-daemon --stacktrace
          fi

      - name: Build Release APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease -Djava.awt.headless=true -Pksp.run.in.process=false --no-daemon --stacktrace || echo "Release build fallback triggered"
          else
            gradle assembleRelease -Djava.awt.headless=true -Pksp.run.in.process=false --no-daemon --stacktrace || echo "Release build fallback triggered"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: statusbar-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statusbar-studio-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: ignore
